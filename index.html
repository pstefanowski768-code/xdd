const menu = document.getElementById("menu");
const game = document.getElementById("game");
const back = document.getElementById("back");
const errorBox = document.getElementById("error");

function decodeSource(encoded) {
  const binary = atob(encoded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function openVersion(encoded) {
  try {
    errorBox.style.display = "none";
    game.srcdoc = decodeSource(encoded);
    menu.style.display = "none";
    game.style.display = "block";
    back.style.display = "block";
  } catch (err) {
    errorBox.textContent = "Błąd uruchamiania: " + err.message;
    errorBox.style.display = "block";
  }
}

function returnToMenu() {
  game.srcdoc = "";
  game.style.display = "none";
  back.style.display = "none";
  menu.style.display = "block";
}

document.getElementById("legacyBtn").addEventListener("click", () => openVersion(LEGACY_SOURCE));
document.getElementById("newBtn").addEventListener("click", () => openVersion(NEW_SOURCE));
back.addEventListener("click", returnToMenu);
</script>
