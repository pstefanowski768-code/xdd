const launcher=document.getElementById('launcher');
const game=document.getElementById('game');
const back=document.getElementById('back');
let gameUrl=null;
function start(source){
  if(gameUrl) URL.revokeObjectURL(gameUrl);
  gameUrl=URL.createObjectURL(new Blob([source],{type:'text/html;charset=utf-8'}));
  game.src=gameUrl;
  launcher.style.display='none';
  game.style.display='block';
  back.style.display='block';
}
function backToLauncher(){
  game.src='about:blank';
  game.style.display='none';
  back.style.display='none';
  launcher.style.display='block';
  if(gameUrl){URL.revokeObjectURL(gameUrl);gameUrl=null;}
}
document.getElementById('oldBtn').addEventListener('click',()=>start(OLD_SOURCE));
document.getElementById('newBtn').addEventListener('click',()=>start(NEW_SOURCE));
back.addEventListener('click',backToLauncher);
</script>
</body>
